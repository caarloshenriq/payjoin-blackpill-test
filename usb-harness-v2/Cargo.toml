[package]
name = "usb-harness-v2"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
harness-device = { path = "../../payjoin-no-std-harness/harness-device" }
cortex-m = { version = "0.7.6", features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt = "0.7"
panic-halt = "1.0"
linked_list_allocator = "0.10"
stm32f4xx-hal = { version = "0.22", features = ["stm32f411", "usb_fs"] }
usb-device = "0.3"
usbd-serial = "0.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
incremental = false
debug = 2
split-debuginfo = "unpacked"
